<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,user-scalable=no">

<title>GreenValley</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #72c95b;
  font-family: Arial, sans-serif;
  overflow: hidden;
  touch-action: none;
}

#game {
  display: block;
  width: 100vw;
  height: 100vh;
}

#ui {
  position: absolute;
  top: 15px;
  left: 15px;
  background: #ffffffdd;
  padding: 12px;
  border-radius: 12px;
  font-weight: bold;
}

#controls {
  position: absolute;
  bottom: 30px;
  left: 20px;
  display: grid;
  grid-template-columns: repeat(3, 65px);
  gap: 5px;
}

button {
  width: 65px;
  height: 65px;
  border: none;
  border-radius: 15px;
  background: #ffffffbb;
  font-size: 28px;
  touch-action: none;
}

button:active {
  background: #ffe066;
}

.empty {
  visibility: hidden;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
🌿 GreenValley<br>
🪙 Монеты: <span id="coins">0</span>
</div>

<div id="controls">
<button class="empty"></button>
<button id="up">⬆️</button>
<button class="empty"></button>

<button id="left">⬅️</button>
<button id="down">⬇️</button>
<button id="right">➡️</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

const world = {
  width: 1600,
  height: 1600
};

const player = {
  x: 800,
  y: 800,
  speed: 3
};

let coins = Number(
  localStorage.getItem("greenvalley_coins") || 0
);

document.getElementById("coins").textContent = coins;

const trees = [];
const gold = [];

for (let i = 0; i < 90; i++) {
  trees.push({
    x: Math.random() * world.width,
    y: Math.random() * world.height
  });
}

for (let i = 0; i < 30; i++) {
  gold.push({
    x: Math.random() * world.width,
    y: Math.random() * world.height
  });
}

const keys = {
  up: false,
  down: false,
  left: false,
  right: false
};

["up", "down", "left", "right"].forEach(id => {
  const button = document.getElementById(id);

  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    keys[id] = true;
    button.setPointerCapture(e.pointerId);
  });

  button.addEventListener("pointerup", () => {
    keys[id] = false;
  });

  button.addEventListener("pointercancel", () => {
    keys[id] = false;
  });

  button.addEventListener("lostpointercapture", () => {
    keys[id] = false;
  });
});

function drawEmoji(emoji, x, y, size) {
  ctx.font = size + "px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(emoji, x, y);
}

function update() {
  if (keys.up) player.y -= player.speed;
  if (keys.down) player.y += player.speed;
  if (keys.left) player.x -= player.speed;
  if (keys.right) player.x += player.speed;

  player.x = Math.max(
    0, Math.min(world.width, player.x)
  );

  player.y = Math.max(
    0, Math.min(world.height, player.y)
  );

  for (let i = gold.length - 1; i >= 0; i--) {
    const c = gold[i];

    const distance = Math.hypot(
      player.x - c.x,
      player.y - c.y
    );

    if (distance < 35) {
      gold.splice(i, 1);
      coins++;

      localStorage.setItem(
        "greenvalley_coins", coins
      );

      document.getElementById("coins").textContent =
        coins;
    }
  }
}

function draw() {
  ctx.fillStyle = "#79cc62";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const cameraX = player.x - canvas.width / 2;
  const cameraY = player.y - canvas.height / 2;

  ctx.save();
  ctx.translate(-cameraX, -cameraY);

  // Трава
  ctx.fillStyle = "#63b94d";

  for (let x = 0; x < world.width; x += 80) {
    for (let y = 0; y < world.height; y += 80) {
      ctx.fillRect(x + 10, y + 10, 8, 4);
    }
  }

  // Дом
  drawEmoji("🏡", 650, 650, 100);

  // Деревья
  trees.forEach(tree => {
    drawEmoji("🌳", tree.x, tree.y, 55);
  });

  // Монеты
  gold.forEach(c => {
    drawEmoji("🪙", c.x, c.y, 30);
  });

  // Персонаж
  drawEmoji("🧍", player.x, player.y, 45);

  ctx.restore();
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
